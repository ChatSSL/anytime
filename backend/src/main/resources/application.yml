spring:
  application:
    name: anytime
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:anytime}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:anytime}
    password: ${DB_PASSWORD:anytime}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  sql:
    init:
      mode: never   # 3단계에서 data.sql 시드가 생기면 always로 바꾼다

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
