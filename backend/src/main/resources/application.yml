spring:
  application:
    name: anytime
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:anytime}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:anytime}
    password: ${DB_PASSWORD:anytime}
  jpa:
    hibernate:
      ddl-auto: none   # 테이블은 db/schema.sql이 만든다. 엔티티는 거기에 맞춰 둔다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  auth:
    allowed-domains: dankook.ac.kr   # 학교 이메일 도메인. 여러 개면 쉼표로
  email:
    hash-key: ${EMAIL_HASH_KEY:}
    enc-key: ${EMAIL_ENC_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
    access-minutes: 15
    refresh-days: 14
  ws:
    allowed-origin-patterns: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080}

logging:
  level:
    com.chatssl.anytime: INFO

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  sql:
    init:
      # always: 실행할 때마다 테이블을 다시 만들고 시드를 넣는다 (로컬 기본)
      # 데이터를 남기고 싶으면 SQL_INIT_MODE=never로 실행
      mode: ${SQL_INIT_MODE:always}

# 로컬 전용 기본 키. 서버(prod)에서는 반드시 환경 변수로 다른 값을 넣는다
app:
  email:
    hash-key: ${EMAIL_HASH_KEY:local-dev-email-hash-key}
    enc-key: ${EMAIL_ENC_KEY:local-dev-email-enc-key}
  jwt:
    secret: ${JWT_SECRET:local-dev-jwt-secret}
  auth:
    # 로컬 전용: POST /api/auth/dev-login {"userId": 1} 로 시드 사용자 토큰을 바로 받는다
    dev-login: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  sql:
    init:
      # 서버는 기본으로 데이터를 지우지 않는다. 처음 배포하거나 시연 전 초기화할 때만 SQL_INIT_MODE=always
      mode: ${SQL_INIT_MODE:never}
